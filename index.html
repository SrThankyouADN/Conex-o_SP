<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor - testeConectorPython.xlsx</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Leitor de Arquivo SharePoint</h1>
        <p class="subtitle">testeConectorPython.xlsx</p>
        
        <div class="form-section">
            <form id="connectionForm">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com" autofocus>
                </div>
                
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required placeholder="Sua senha">
                </div>
                
                <div class="form-group">
                    <label for="caminho">Caminho do arquivo (OneDrive):</label>
                    <input type="text" id="caminho" name="caminho" required placeholder="ex: teste/testeConectorPython.xlsx" value="teste/testeConectorPython.xlsx">
                </div>
                
                <button type="submit" class="btn-conectar">Conectar</button>
                <button type="button" id="listarBtn" class="btn-listar">Listar Arquivos</button>
            </form>
            
            <div id="message" class="message"></div>
            <div id="arquivosLista" style="display: none; margin-top: 20px;">
                <h3>Arquivos disponíveis no OneDrive:</h3>
                <div id="pastasList"></div>
                <div id="arquivosList"></div>
            </div>
        </div>
        
        <div id="tableContainer" class="table-section" style="display: none;">
            <h2>Dados do Arquivo</h2>
            <table id="resultsTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const form = document.getElementById('connectionForm');
        const messageDiv = document.getElementById('message');
        const tableContainer = document.getElementById('tableContainer');
        const tableHead = document.getElementById('resultsTable').querySelector('thead');
        const tableBody = document.getElementById('resultsTable').querySelector('tbody');
        const listarBtn = document.getElementById('listarBtn');
        const arquivosLista = document.getElementById('arquivosLista');
        const pastasList = document.getElementById('pastasList');
        const arquivosList = document.getElementById('arquivosList');

        // Carregar credenciais ao iniciar
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/credentials.json');
                if (response.ok) {
                    const creds = await response.json();
                    if (creds.email) document.getElementById('email').value = creds.email;
                    if (creds.senha) document.getElementById('senha').value = creds.senha;
                    console.log('[OK] Credenciais carregadas');
                }
            } catch (err) {
                console.log('[*] Arquivo credentials.json não disponível');
            }
        });

        // Botão Listar Arquivos
        listarBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            
            if (!email || !senha) {
                messageDiv.textContent = '✗ Digite email e senha primeiro';
                messageDiv.className = 'message error';
                return;
            }
            
            messageDiv.textContent = 'Listando arquivos...';
            messageDiv.className = 'message info';
            
            try {
                const response = await fetch(`https://localhost:8443/api/listar-arquivos?email=${encodeURIComponent(email)}&senha=${encodeURIComponent(senha)}`, {
                    method: 'GET'
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Erro ao listar');
                }
                
                const data = await response.json();
                
                // Limpar listas
                pastasList.innerHTML = '';
                arquivosList.innerHTML = '';
                
                // Mostrar pastas
                if (data.pastas && data.pastas.length > 0) {
                    pastasList.innerHTML = '<h4>📁 Pastas:</h4>' + 
                        data.pastas.map(p => `<div class="item-lista">${p.nome}/</div>`).join('');
                }
                
                // Mostrar arquivos
                if (data.arquivos && data.arquivos.length > 0) {
                    arquivosList.innerHTML = '<h4>📄 Arquivos:</h4>' + 
                        data.arquivos.map(a => `<div class="item-lista">${a.nome}</div>`).join('');
                }
                
                messageDiv.textContent = `✓ ${data.total} itens encontrados`;
                messageDiv.className = 'message success';
                arquivosLista.style.display = 'block';
                
            } catch (error) {
                messageDiv.textContent = `✗ ${error.message}`;
                messageDiv.className = 'message error';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const caminho = document.getElementById('caminho').value.trim();
            
            messageDiv.textContent = 'Conectando...';
            messageDiv.className = 'message info';
            tableContainer.style.display = 'none';
            
            try {
                console.log('[*] Enviando credenciais...');
                
                const response = await fetch('https://localhost:8443/api/dados', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, senha, caminho_arquivo: caminho })
                });
                
                console.log('[*] Status:', response.status);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Erro na conexão');
                }
                
                const data = await response.json();
                console.log('[OK] Dados recebidos:', data.total_linhas, 'linhas');
                
                if (data.sucesso) {
                    messageDiv.textContent = `✓ Sucesso! ${data.total_linhas} linhas encontradas.`;
                    messageDiv.className = 'message success';
                    
                    // Limpar tabela
                    tableHead.innerHTML = '';
                    tableBody.innerHTML = '';
                    
                    // Criar cabeçalho
                    const headerRow = document.createElement('tr');
                    data.headers.forEach(header => {
                        const th = document.createElement('th');
                        th.textContent = header;
                        headerRow.appendChild(th);
                    });
                    tableHead.appendChild(headerRow);
                    
                    // Preencher dados
                    data.dados.forEach(row => {
                        const tr = document.createElement('tr');
                        row.forEach(cell => {
                            const td = document.createElement('td');
                            td.textContent = cell;
                            tr.appendChild(td);
                        });
                        tableBody.appendChild(tr);
                    });
                    
                    tableContainer.style.display = 'block';
                    document.getElementById('senha').value = '';
                }
            } catch (error) {
                console.error('[ERRO]', error.message);
                
                if (error.message.includes('Acesso bloqueado')) {
                    messageDiv.textContent = '✗ Acesso bloqueado por Conditional Access. Contacte administrador.';
                } else if (error.message.includes('Credenciais')) {
                    messageDiv.textContent = '✗ Credenciais inválidas. Verifique email e senha.';
                } else if (error.message.includes('não encontrado') || error.message.includes('404')) {
                    messageDiv.textContent = '✗ Arquivo não encontrado. Verifique o caminho (ex: pasta/arquivo.xlsx)';
                } else if (error.message.includes('Failed to fetch')) {
                    messageDiv.textContent = '✗ Erro de conexão. Acesse https://localhost:8443';
                } else {
                    messageDiv.textContent = `✗ Erro: ${error.message}`;
                }
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
