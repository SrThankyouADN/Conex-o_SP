<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor - testeConectorPython.xlsx</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Leitor de Arquivo SharePoint</h1>
        <p class="subtitle">testeConectorPython.xlsx</p>
        
        <div class="form-section">
            <form id="connectionForm">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com" autofocus>
                </div>
                
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required placeholder="Sua senha">
                </div>
                
                <button type="submit" class="btn-conectar">Conectar</button>
            </form>
            
            <div id="message" class="message"></div>
        </div>
        
        <div id="tableContainer" class="table-section" style="display: none;">
            <h2>Dados do Arquivo</h2>
            <table id="resultsTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const form = document.getElementById('connectionForm');
        const messageDiv = document.getElementById('message');
        const tableContainer = document.getElementById('tableContainer');
        const tableHead = document.getElementById('resultsTable').querySelector('thead');
        const tableBody = document.getElementById('resultsTable').querySelector('tbody');

        // Carregar credenciais do arquivo JSON ao iniciar
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/credentials.json');
                if (response.ok) {
                    const creds = await response.json();
                    if (creds.email) document.getElementById('email').value = creds.email;
                    if (creds.senha) document.getElementById('senha').value = creds.senha;
                    console.log('[OK] Credenciais carregadas do arquivo');
                }
            } catch (err) {
                console.log('[*] Arquivo de credenciais não encontrado ou não acessível');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            
            messageDiv.textContent = 'Conectando...';
            messageDiv.className = 'message info';
            tableContainer.style.display = 'none';
            
            try {
                console.log('[*] Iniciando requisição de autenticação...');
                
                const response = await fetch('https://localhost:8443/api/dados', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, senha })
                });
                
                console.log('[*] Resposta recebida:', response.status);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Erro na conexão');
                }
                
                const data = await response.json();
                console.log('[OK] Dados recebidos:', data);
                
                if (data.sucesso) {
                    messageDiv.textContent = `✓ Sucesso! ${data.total_linhas} linhas encontradas.`;
                    messageDiv.className = 'message success';
                    
                    // Limpar tabela anterior
                    tableHead.innerHTML = '';
                    tableBody.innerHTML = '';
                    
                    // Criar cabeçalho
                    const headerRow = document.createElement('tr');
                    data.headers.forEach(header => {
                        const th = document.createElement('th');
                        th.textContent = header;
                        headerRow.appendChild(th);
                    });
                    tableHead.appendChild(headerRow);
                    
                    // Preencher dados
                    data.dados.forEach(row => {
                        const tr = document.createElement('tr');
                        data.headers.forEach(header => {
                            const td = document.createElement('td');
                            td.textContent = row[header] || '';
                            tr.appendChild(td);
                        });
                        tableBody.appendChild(tr);
                    });
                    
                    tableContainer.style.display = 'block';
                    document.getElementById('senha').value = '';
                }
            } catch (error) {
                console.error('[ERRO]', error);
                
                if (error.message.includes('Credenciais')) {
                    messageDiv.textContent = `✗ Credenciais inválidas. Verifique email e senha.`;
                } else if (error.message.includes('Failed to fetch')) {
                    messageDiv.textContent = `✗ Erro de conexão. Acesse https://localhost:8443`;
                } else {
                    messageDiv.textContent = `✗ Erro: ${error.message}`;
                }
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
