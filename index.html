<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Conector SharePoint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Teste de Conectividade - SharePoint</h1>
        
        <div class="form-section">
            <form id="connectionForm">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required placeholder="Sua senha">
                </div>
                
                <button type="submit" class="btn-conectar">Conectar</button>
            </form>
            
            <div id="message" class="message"></div>
        </div>
        
        <div id="tableContainer" class="table-section" style="display: none;">
            <h2>Dados do Arquivo</h2>
            <table id="resultsTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const form = document.getElementById('connectionForm');
        const messageDiv = document.getElementById('message');
        const tableContainer = document.getElementById('tableContainer');
        const tableHead = document.getElementById('resultsTable').querySelector('thead');
        const tableBody = document.getElementById('resultsTable').querySelector('tbody');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            
            messageDiv.textContent = 'Conectando...';
            messageDiv.className = 'message info';
            tableContainer.style.display = 'none';
            
            try {
                const response = await fetch('https://localhost:8443/api/dados', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, senha })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Erro na conexão');
                }
                
                const data = await response.json();
                
                if (data.sucesso) {
                    messageDiv.textContent = `✓ Conectado! ${data.total_linhas} linhas encontradas.`;
                    messageDiv.className = 'message success';
                    
                    // Limpar tabela anterior
                    tableHead.innerHTML = '';
                    tableBody.innerHTML = '';
                    
                    // Criar cabeçalho
                    const headerRow = document.createElement('tr');
                    data.headers.forEach(header => {
                        const th = document.createElement('th');
                        th.textContent = header;
                        headerRow.appendChild(th);
                    });
                    tableHead.appendChild(headerRow);
                    
                    // Preencher dados
                    data.dados.forEach(row => {
                        const tr = document.createElement('tr');
                        data.headers.forEach(header => {
                            const td = document.createElement('td');
                            td.textContent = row[header] || '';
                            tr.appendChild(td);
                        });
                        tableBody.appendChild(tr);
                    });
                    
                    tableContainer.style.display = 'block';
                    document.getElementById('senha').value = '';
                }
            } catch (error) {
                messageDiv.textContent = `✗ Erro: ${error.message}`;
                messageDiv.className = 'message error';
                console.error('Erro:', error);
            }
        });
    </script>
</body>
</html>
