<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador de Arquivos - SharePoint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Navegador de Arquivos</h1>
        <p class="subtitle">Explore seus arquivos no SharePoint</p>
        
        <!-- Seção de Autenticação -->
        <div id="authSection" class="auth-section">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="seu.email@sp.gov.br" required autofocus>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="sua senha" required>
            </div>
            <button id="btnConectar" class="btn btn-primary">Conectar</button>
            <div id="authMessage" class="message"></div>
        </div>

        <!-- Seção de Navegação -->
        <div id="navSection" class="nav-section" style="display:none;">
            <div class="nav-header">
                <span id="userInfo" class="user-info"></span>
                <button id="btnSair" class="btn btn-logout">Sair</button>
            </div>

            <div class="two-panel">
                <!-- Painel Esquerdo: Lista de Sites -->
                <div class="panel panel-left">
                    <h3>Grupos/Sites</h3>
                    <div id="sitesList" class="list-container">
                        <div class="loading">Carregando sites...</div>
                    </div>
                </div>

                <!-- Painel Direito: Lista de Arquivos -->
                <div class="panel panel-right">
                    <h3>Arquivos</h3>
                    <div id="filesList" class="list-container">
                        <div class="placeholder">Selecione um site para ver seus arquivos</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Seção de Exibição de Arquivo -->
        <div id="dataSection" class="data-section" style="display:none;">
            <div class="data-header">
                <button id="btnVoltar" class="btn btn-secondary">Voltar</button>
                <span id="fileName" class="file-name"></span>
            </div>
            <div id="dataContainer" class="data-container"></div>
        </div>
    </div>

    <script>
        // Estado global
        let estadoGlobal = {
            email: '',
            senha: '',
            token: '',
            siteSelecionado: null,
            siteSelecionadoId: null,
            driveAtual: null,
            pastaAtual: null,
            historioPastas: [] // Array de {pastaId, pastaNome}
        };

        // Elementos DOM
        const authSection = document.getElementById('authSection');
        const navSection = document.getElementById('navSection');
        const dataSection = document.getElementById('dataSection');
        const btnConectar = document.getElementById('btnConectar');
        const btnSair = document.getElementById('btnSair');
        const btnVoltar = document.getElementById('btnVoltar');
        const emailInput = document.getElementById('email');
        const senhaInput = document.getElementById('senha');
        const sitesList = document.getElementById('sitesList');
        const filesList = document.getElementById('filesList');
        const userInfo = document.getElementById('userInfo');
        const fileName = document.getElementById('fileName');
        const dataContainer = document.getElementById('dataContainer');
        const authMessage = document.getElementById('authMessage');

        // Carregar credenciais ao iniciar
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/credentials.json');
                if (response.ok) {
                    const creds = await response.json();
                    if (creds.email) emailInput.value = creds.email;
                    if (creds.senha) senhaInput.value = creds.senha;
                }
            } catch (err) {
                console.log('[*] Arquivo credentials.json não disponível');
            }
        });

        // Botão Conectar
        btnConectar.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const senha = senhaInput.value;
            
            if (!email || !senha) {
                authMessage.textContent = 'Digite email e senha';
                authMessage.className = 'message error';
                return;
            }
            
            authMessage.textContent = 'Conectando...';
            authMessage.className = 'message info';
            btnConectar.disabled = true;
            
            try {
                // Obter token
                const tokenResponse = await fetch('https://localhost:8443/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                
                if (!tokenResponse.ok) {
                    const error = await tokenResponse.json();
                    throw new Error(error.detail || 'Erro de autenticação');
                }
                
                const tokenData = await tokenResponse.json();
                estadoGlobal.email = email;
                estadoGlobal.senha = senha;
                estadoGlobal.token = tokenData.token;
                
                // Mostrar seção de navegação
                authSection.style.display = 'none';
                navSection.style.display = 'block';
                userInfo.textContent = `Conectado como: ${email}`;
                
                // Carregar sites
                await carregarSites();
                
            } catch (error) {
                authMessage.textContent = `Erro: ${error.message}`;
                authMessage.className = 'message error';
                btnConectar.disabled = false;
            }
        });

        // Botão Sair
        btnSair.addEventListener('click', () => {
            estadoGlobal = {
                email: '',
                senha: '',
                token: '',
                siteSelecionado: null,
                siteSelecionadoId: null
            };
            authSection.style.display = 'block';
            navSection.style.display = 'none';
            dataSection.style.display = 'none';
            authMessage.textContent = '';
            sitesList.innerHTML = '<div class="placeholder">Selecione um site para ver seus arquivos</div>';
            filesList.innerHTML = '<div class="placeholder">Selecione um site para ver seus arquivos</div>';
            senhaInput.value = '';
            btnConectar.disabled = false;
        });

        // Botão Voltar
        btnVoltar.addEventListener('click', () => {
            dataSection.style.display = 'none';
            navSection.style.display = 'block';
        });

        // Carregar sites
        async function carregarSites() {
            sitesList.innerHTML = '<div class="loading">Carregando sites...</div>';
            filesList.innerHTML = '<div class="placeholder">Selecione um site para ver seus arquivos</div>';
            
            try {
                const response = await fetch('https://localhost:8443/api/sites', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${estadoGlobal.token}`
                    }
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Erro ao carregar sites');
                }
                
                const sites = await response.json();
                
                if (!sites || sites.length === 0) {
                    sitesList.innerHTML = '<div class="placeholder">Nenhum site encontrado</div>';
                    return;
                }
                
                sitesList.innerHTML = sites.map(site => `
                    <div class="list-item" data-site-id="${site.id}" data-site-name="${site.nome}">
                        <div class="item-name">📁 ${site.nome}</div>
                        <div class="item-type">${site.tipo}</div>
                    </div>
                `).join('');
                
                // Adicionar listeners para cada site
                document.querySelectorAll('.list-item').forEach(item => {
                    item.addEventListener('click', async () => {
                        const siteId = item.getAttribute('data-site-id');
                        const siteName = item.getAttribute('data-site-name');
                        estadoGlobal.siteSelecionado = siteName;
                        estadoGlobal.siteSelecionadoId = siteId;
                        estadoGlobal.historioPastas = []; // Reset histórico
                        estadoGlobal.driveAtual = null;
                        estadoGlobal.pastaAtual = null;
                        
                        // Destacar item selecionado
                        document.querySelectorAll('.list-item').forEach(i => i.classList.remove('active'));
                        item.classList.add('active');
                        
                        // Carregar arquivos
                        await carregarArquivos(siteId, null, null);
                    });
                });
                
            } catch (error) {
                sitesList.innerHTML = `<div class="error-msg">Erro: ${error.message}</div>`;
            }
        }

        // Carregar arquivos de um site
        async function carregarArquivos(siteId, driveId, folderId) {
            filesList.innerHTML = '<div class="loading">Carregando arquivos...</div>';
            
            try {
                let url;
                let drive_id_atual = driveId;
                
                if (folderId) {
                    // Listar conteúdo de uma pasta específica
                    console.log(`[*] Carregando pasta: drive=${drive_id_atual}, folder=${folderId}`);
                    url = `https://localhost:8443/api/pastas/${drive_id_atual}/${folderId}/conteudo`;
                } else {
                    // Listar raiz do site
                    console.log(`[*] Carregando site: ${siteId}`);
                    url = `https://localhost:8443/api/sites/${siteId}/arquivos`;
                }
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${estadoGlobal.token}`
                    }
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Erro ao carregar arquivos');
                }
                
                const dados = await response.json();
                
                // Se veio de site root, atualizar drive_id
                if (siteId && !folderId && dados.drive_id) {
                    estadoGlobal.driveAtual = dados.drive_id;
                    drive_id_atual = dados.drive_id;
                    console.log(`[OK] Drive ID armazenado: ${dados.drive_id}`);
                }
                
                let html = '';
                
                // Mostrar breadcrumb de navegação
                if (estadoGlobal.historioPastas.length > 0) {
                    html += '<div class="breadcrumb">';
                    html += '<span class="breadcrumb-item" onclick="voltarPasta()">&larr; Raiz</span>';
                    estadoGlobal.historioPastas.forEach((pasta, idx) => {
                        html += `<span class="breadcrumb-item"> / ${pasta.pastaNome}</span>`;
                    });
                    html += '</div>';
                }
                
                // Mostrar pastas
                if (dados.pastas && dados.pastas.length > 0) {
                    html += '<div class="section-title">📁 Pastas</div>';
                    html += dados.pastas.map(pasta => `
                        <div class="list-item folder" onclick="entrarPasta('${drive_id_atual}', '${pasta.id}', '${pasta.nome.replace(/'/g, "\\'")}')">
                            <div class="item-name">📂 ${pasta.nome}/</div>
                            <div class="item-hint">Clique para explorar</div>
                        </div>
                    `).join('');
                }
                
                // Mostrar arquivos
                if (dados.arquivos && dados.arquivos.length > 0) {
                    html += '<div class="section-title">📄 Arquivos</div>';
                    html += dados.arquivos.map(arquivo => `
                        <div class="list-item file" data-drive-id="${arquivo.drive_id}" data-item-id="${arquivo.id}" data-file-name="${arquivo.nome}">
                            <div class="item-name">${arquivo.nome}</div>
                            <div class="item-size">${formatarTamanha(arquivo.size)}</div>
                        </div>
                    `).join('');
                }
                
                if (!html) {
                    html = '<div class="placeholder">Nenhum arquivo encontrado</div>';
                }
                
                filesList.innerHTML = html;
                
                // Adicionar listeners para arquivos
                document.querySelectorAll('.list-item.file').forEach(item => {
                    item.addEventListener('click', async () => {
                        const driveId = item.getAttribute('data-drive-id');
                        const itemId = item.getAttribute('data-item-id');
                        const nomearquivo = item.getAttribute('data-file-name');
                        
                        await abrirArquivo(driveId, itemId, nomearquivo);
                    });
                });
                
            } catch (error) {
                console.error('[ERRO]', error);
                filesList.innerHTML = `<div class="error-msg">Erro: ${error.message}</div>`;
            }
        }

        // Entrar em uma pasta
        async function entrarPasta(driveId, folderId, folderName) {
            console.log(`[*] Entrando em pasta: drive=${driveId}, folder=${folderId}, name=${folderName}`);
            
            // Atualizar histórico
            estadoGlobal.historioPastas.push({
                pastaId: folderId,
                pastaNome: folderName
            });
            
            estadoGlobal.driveAtual = driveId;
            estadoGlobal.pastaAtual = folderId;
            
            // Recarregar listagem
            await carregarArquivos(null, driveId, folderId);
        }

        // Voltar para pasta anterior
        async function voltarPasta() {
            if (estadoGlobal.historioPastas.length === 0) {
                return; // Já é raiz
            }
            
            estadoGlobal.historioPastas.pop();
            
            if (estadoGlobal.historioPastas.length === 0) {
                // Voltou para raiz
                estadoGlobal.pastaAtual = null;
                await carregarArquivos(estadoGlobal.siteSelecionadoId, estadoGlobal.driveAtual, null);
            } else {
                // Entrar na pasta anterior do histórico
                const pastaAnterior = estadoGlobal.historioPastas[estadoGlobal.historioPastas.length - 1];
                estadoGlobal.pastaAtual = pastaAnterior.pastaId;
                await carregarArquivos(null, estadoGlobal.driveAtual, pastaAnterior.pastaId);
            }
        }

        // Abrir e exibir arquivo
        async function abrirArquivo(driveId, itemId, nomearquivo) {
            dataContainer.innerHTML = '<div class="loading">Carregando arquivo...</div>';
            navSection.style.display = 'none';
            dataSection.style.display = 'block';
            fileName.textContent = nomearquivo;
            
            try {
                const response = await fetch(`https://localhost:8443/api/arquivos/${driveId}/${itemId}/conteudo`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${estadoGlobal.token}`
                    }
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Erro ao carregar arquivo');
                }
                
                const dados = await response.json();
                
                // Criar tabela
                let tableHtml = '<table class="data-table"><thead><tr>';
                dados.headers.forEach(header => {
                    tableHtml += `<th>${header}</th>`;
                });
                tableHtml += '</tr></thead><tbody>';
                
                dados.dados.forEach(row => {
                    tableHtml += '<tr>';
                    row.forEach(cell => {
                        tableHtml += `<td>${cell || ''}</td>`;
                    });
                    tableHtml += '</tr>';
                });
                
                tableHtml += `</tbody></table>
                    <div class="data-info">Total de linhas: ${dados.total_linhas}</div>`;
                
                dataContainer.innerHTML = tableHtml;
                
            } catch (error) {
                dataContainer.innerHTML = `<div class="error-msg">Erro: ${error.message}</div>`;
            }
        }

        // Funções auxiliares
        function formatarTamanha(bytes) {
            if (!bytes) return '';
            const kb = bytes / 1024;
            if (kb < 1024) return `${kb.toFixed(1)} KB`;
            const mb = kb / 1024;
            return `${mb.toFixed(1)} MB`;
        }
    </script>
</body>
</html>
