<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor - testeConectorPython.xlsx</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Leitor de Arquivo SharePoint</h1>
        <p class="subtitle">testeConectorPython.xlsx</p>
        
        <div class="form-section">
            <form id="connectionForm">
                <button type="submit" class="btn-conectar">Carregar Arquivo</button>
            </form>
            
            <div id="message" class="message"></div>
        </div>
        
        <div id="tableContainer" class="table-section" style="display: none;">
            <h2>Dados do Arquivo</h2>
            <table id="resultsTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const form = document.getElementById('connectionForm');
        const messageDiv = document.getElementById('message');
        const tableContainer = document.getElementById('tableContainer');
        const tableHead = document.getElementById('resultsTable').querySelector('thead');
        const tableBody = document.getElementById('resultsTable').querySelector('tbody');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            messageDiv.textContent = 'Carregando arquivo...';
            messageDiv.className = 'message info';
            tableContainer.style.display = 'none';
            
            try {
                console.log('[*] Iniciando requisição...');
                
                const response = await fetch('https://localhost:8443/api/dados', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                console.log('[*] Resposta recebida:', response.status);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Erro na conexão');
                }
                
                const data = await response.json();
                console.log('[OK] Dados recebidos:', data);
                
                if (data.sucesso) {
                    messageDiv.textContent = `✓ Sucesso! ${data.total_linhas} linhas encontradas.`;
                    messageDiv.className = 'message success';
                    
                    // Limpar tabela anterior
                    tableHead.innerHTML = '';
                    tableBody.innerHTML = '';
                    
                    // Criar cabeçalho
                    const headerRow = document.createElement('tr');
                    data.headers.forEach(header => {
                        const th = document.createElement('th');
                        th.textContent = header;
                        headerRow.appendChild(th);
                    });
                    tableHead.appendChild(headerRow);
                    
                    // Preencher dados
                    data.dados.forEach(row => {
                        const tr = document.createElement('tr');
                        data.headers.forEach(header => {
                            const td = document.createElement('td');
                            td.textContent = row[header] || '';
                            tr.appendChild(td);
                        });
                        tableBody.appendChild(tr);
                    });
                    
                    tableContainer.style.display = 'block';
                }
            } catch (error) {
                console.error('[ERRO]', error);
                
                // Tratamentos específicos de erro
                if (error.message.includes('Failed to fetch')) {
                    messageDiv.textContent = `✗ Erro de conexão. Verifique https://localhost:8443`;
                } else {
                    messageDiv.textContent = `✗ Erro: ${error.message}`;
                }
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
