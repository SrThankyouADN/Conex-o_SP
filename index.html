<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor - testeConectorPython.xlsx</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Leitor de Arquivo SharePoint</h1>
        <p class="subtitle">testeConectorPython.xlsx</p>
        
        <div class="form-section">
            <div id="loginSection">
                <button id="loginBtn" class="btn-conectar" style="font-size: 16px; padding: 12px;">
                    🔐 Login com Microsoft
                </button>
            </div>
            
            <div id="logoutSection" style="display: none; text-align: center;">
                <p id="userInfo" style="margin-bottom: 10px;"></p>
                <button id="logoutBtn" class="btn-conectar" style="background-color: #6c757d;">
                    Desconectar
                </button>
            </div>
            
            <div id="message" class="message"></div>
        </div>
        
        <div id="tableContainer" class="table-section" style="display: none;">
            <h2>Dados do Arquivo</h2>
            <table id="resultsTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginSection = document.getElementById('loginSection');
        const logoutSection = document.getElementById('logoutSection');
        const userInfo = document.getElementById('userInfo');
        const messageDiv = document.getElementById('message');
        const tableContainer = document.getElementById('tableContainer');
        const tableHead = document.getElementById('resultsTable').querySelector('thead');
        const tableBody = document.getElementById('resultsTable').querySelector('tbody');

        // Verificar se voltou do callback OAuth2
        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const authStatus = urlParams.get('auth');
            
            if (authStatus === 'success') {
                console.log('[OK] Login realizado com sucesso!');
                messageDiv.textContent = 'Autenticado! Carregando dados...';
                messageDiv.className = 'message info';
                
                // Limpar URL
                window.history.replaceState({}, document.title, window.location.origin + window.location.pathname);
                
                // Aguardar um pouco e carregar dados
                setTimeout(async () => {
                    await loadData();
                }, 1000);
            } else if (authStatus === 'error') {
                const errorMsg = urlParams.get('message') || 'Erro desconhecido';
                console.log('[ERRO]', errorMsg);
                messageDiv.textContent = `✗ Erro no login: ${errorMsg}`;
                messageDiv.className = 'message error';
                window.history.replaceState({}, document.title, window.location.origin + window.location.pathname);
            }
            
            updateUIState();
        });

        // Botão Login
        loginBtn.addEventListener('click', async () => {
            try {
                console.log('[*] Iniciando processo de login...');
                messageDiv.textContent = 'Redirecionando para Microsoft...';
                messageDiv.className = 'message info';
                
                const response = await fetch('https://localhost:8443/api/login-url', {
                    method: 'GET'
                });
                
                if (!response.ok) throw new Error('Erro ao obter URL de login');
                
                const { login_url } = await response.json();
                console.log('[OK] URL obtida, redirecionando...');
                
                window.location.href = login_url;
                
            } catch (error) {
                console.error('[ERRO]', error);
                messageDiv.textContent = `✗ Erro ao iniciar login: ${error.message}`;
                messageDiv.className = 'message error';
            }
        });

        // Botão Logout
        logoutBtn.addEventListener('click', async () => {
            try {
                await fetch('https://localhost:8443/api/logout');
                console.log('[OK] Desconectado');
                tableContainer.style.display = 'none';
                messageDiv.textContent = '';
                updateUIState();
            } catch (error) {
                console.error('[ERRO]', error);
            }
        });

        // Carregar dados do arquivo
        async function loadData() {
            try {
                console.log('[*] Buscando dados do arquivo...');
                messageDiv.textContent = 'Carregando arquivo...';
                
                const response = await fetch('https://localhost:8443/api/dados', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({})
                });
                
                console.log('[*] Status:', response.status);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Erro ao carregar arquivo');
                }
                
                const data = await response.json();
                console.log('[OK] Dados recebidos:', data);
                
                if (data.sucesso) {
                    messageDiv.textContent = `✓ Sucesso! ${data.total_linhas} linhas encontradas.`;
                    messageDiv.className = 'message success';
                    
                    // Criar cabeçalho
                    tableHead.innerHTML = '';
                    const headerRow = document.createElement('tr');
                    data.headers.forEach(header => {
                        const th = document.createElement('th');
                        th.textContent = header;
                        headerRow.appendChild(th);
                    });
                    tableHead.appendChild(headerRow);
                    
                    // Preencher dados
                    tableBody.innerHTML = '';
                    data.dados.forEach(row => {
                        const tr = document.createElement('tr');
                        row.forEach((cell, index) => {
                            const td = document.createElement('td');
                            td.textContent = cell;
                            tr.appendChild(td);
                        });
                        tableBody.appendChild(tr);
                    });
                    
                    tableContainer.style.display = 'block';
                    updateUIState();
                }
            } catch (error) {
                console.error('[ERRO]', error);
                messageDiv.textContent = `✗ ${error.message}`;
                messageDiv.className = 'message error';
                
                if (error.message.includes('não autenticado')) {
                    updateUIState(false);
                }
            }
        }

        // Atualizar estado da UI
        function updateUIState(isAuthenticated = null) {
            if (tableContainer.style.display === 'block') {
                loginSection.style.display = 'none';
                logoutSection.style.display = 'block';
            } else {
                loginSection.style.display = 'block';
                logoutSection.style.display = 'none';
            }
        }
    </script>
</body>
</html>
